{% extends "base.html" %}

{% block title %}プロフィール編集{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/profile_trainer_edit.css') }}">
{% endblock %}

{% block content %}
<section class="pe">
  <h1>プロフィール編集</h1>

  <form class="pe-form" action="{{ url_for('profile_trainer_edit_done') }}" method="get">

    <div class="pe-panel">
      <div class="pe-item">
        <label class="pe-label" for="name">名前</label>
        <input class="pe-input" type="text" id="name" name="name" placeholder="名前を入力">
      </div>
      <div class="pe-item">
        <label class="pe-label" for="age">年齢</label>
        <input class="pe-input" type="number" id="age" name="age" placeholder="年齢を入力">
      </div>
      <div class="pe-item">
        <label class="pe-label" for="gender">性別</label>
        <select class="pe-input" id="gender" name="gender">
          <option value="">選択してください</option>
          <option value="男性">男性</option>
          <option value="女性">女性</option>
          <option value="その他">その他</option>
          <option value="回答しない">回答しない</option>
        </select>
      </div>
      <div class="pe-item">
        <label class="pe-label" for="location">活動地</label>
        <input class="pe-input" type="text" id="location" name="location" placeholder="活動地を入力">
      </div>
      <div class="pe-item">
        <label class="pe-label" for="contact">問い合わせ</label>
        <input class="pe-input" type="text" id="contact" name="contact" placeholder="問い合わせ先を入力">
      </div>
      <div class="pe-item">
        <label class="pe-label" for="career">経歴</label>
        <textarea class="pe-input pe-area" id="career" name="career" placeholder="経歴を入力"></textarea>
      </div>
      <div class="pe-item">
        <label class="pe-label" for="genre">得意ジャンル</label>
        <input class="pe-input" type="text" id="genre" name="genre" placeholder="得意ジャンルを入力">
      </div>
      <div class="pe-item">
        <label class="pe-label" for="comment">コメント（一言）</label>
        <textarea class="pe-input pe-area" id="comment" name="comment" placeholder="コメントを入力"></textarea>
      </div>
    </div>

    <h2 class="pe-heading">料金設定</h2>
    <div class="pe-panel">
      <div class="pe-item">
        <label class="pe-label" for="feedback_price">フィードバック料金<small>ワンコーラスあたり（円）</small></label>
        <input class="pe-input" type="number" id="feedback_price" name="feedback_price" min="0" step="1" placeholder="例：1000">
      </div>
      <div class="pe-item">
        <label class="pe-label" for="lesson_price">レッスン料金<small>1回あたり（円）</small></label>
        <input class="pe-input" type="number" id="lesson_price" name="lesson_price" min="0" step="1" placeholder="例：5000">
      </div>
    </div>

    <div class="pe-actions">
      <a class="pe-cancel" href="{{ url_for('profile_trainer') }}">キャンセル</a>
      <button type="submit" class="pe-submit">保存</button>
    </div>
  </form>
</section>
{% endblock %}
