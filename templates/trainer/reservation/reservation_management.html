{% extends "base.html" %}
{% load static %}

{% block title %}予約管理{% endblock %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/reservation_management.css' %}">
{% endblock %}

{% block content %}
<section class="rm">
  <h1>予約管理</h1>
  <p class="rm-lead">予約の確認と、予約枠の管理ができます。</p>

  <a class="rm-main" href="{% url 'reservation_list' %}">
    <span class="rm-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
    <span class="rm-text"><span class="rm-title">予約一覧</span><span class="rm-desc">入っている予約を確認する</span></span>
    <svg class="rm-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </a>

  <div class="rm-grid">
    <a class="rm-card" href="{% url 'reservation_slot_create' %}">
      <span class="rm-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>
      <span class="rm-text"><span class="rm-title">予約枠作成</span><span class="rm-desc">新しい枠を追加する</span></span>
    </a>
    <a class="rm-card" href="{% url 'available_slots' %}">
      <span class="rm-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>
      <span class="rm-text"><span class="rm-title">空き枠一覧</span><span class="rm-desc">変更・削除する</span></span>
    </a>
  </div>

  <a class="rm-back" href="{% url 'trainer_home' %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    トレーナーホームに戻る
  </a>
</section>
{% endblock %}
