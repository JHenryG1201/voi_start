{% extends "base.html" %}

{% block title %}予約一覧{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/reservation_list.css') }}">
{% endblock %}

{% block content %}
<section class="rl">
  <h1>予約一覧</h1>
  <p class="rl-lead">入っている予約を確認できます。</p>

  <ul class="rl-list">
    <li>
      <a class="rl-card" href="{{ url_for('reservation_detail', reservation_id=1) }}">
        <span class="rl-text">
          <span class="rl-date">2026/10/10</span>
          <span class="rl-time">14:00～15:00</span>
          <span class="rl-meta">
            <span class="rl-name">生徒A</span>
            <span class="rl-tag">オンライン</span>
          </span>
        </span>
        <svg class="rl-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </li>
  </ul>

  <a class="rl-back" href="{{ url_for('reservation_management') }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    予約管理に戻る
  </a>
</section>
{% endblock %}
