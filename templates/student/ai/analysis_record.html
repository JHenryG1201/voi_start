{% extends "base.html" %}

{% block title %}分析記録{% endblock %}

{% block content %}

    <h1>分析記録</h1>

        <ul>
            {% for record in records %}
            <li>
                <a href="{% url 'analysis_record_detail' record.id %}">
                    {{ record.created_at|date:"Y/m/d H:i" }}　音域：{{ record.low_note }}～{{ record.high_note }}
                </a>
            </li>
            {% empty %}
            <li>分析記録はまだありません。</li>
            {% endfor %}
        </ul>
        
    <p>
        <a href="/ai_analysis">AI分析に戻る</a>
    </p>

{% endblock %}
