{% extends "base.html" %}
{% load static %}

{% block title %}AI分析{% endblock %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/ai_analysis.css' %}">
{% endblock %}

{% block content %}
<section class="ai">
  <h1>AI分析</h1>
  <p class="ai-lead">声を測定して、あなたの特徴を診断します。</p>

  <div class="ai-cards">
    <a class="ai-card main" href="/student/measurement">
      <span class="ai-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
      <span class="ai-text"><span class="ai-title">測定</span><span class="ai-desc">声を録音してAIが分析します</span></span>
      <svg class="ai-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>

    <a class="ai-card" href="/student/analysis_record">
      <span class="ai-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3l2-6 4 12 3-9 2 3h4"/></svg></span>
      <span class="ai-text"><span class="ai-title">分析記録</span><span class="ai-desc">過去の結果を見返します</span></span>
      <svg class="ai-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </div>

  <a class="ai-back" href="/home_student">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    生徒ホームに戻る
  </a>
</section>
{% endblock %}
