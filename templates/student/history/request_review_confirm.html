{% extends "base.html" %}

{% block title %}評価内容確認{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/request_review_confirm.css') }}">
{% endblock %}

{% block content %}
<section class="rc">
  <h1>評価内容確認</h1>
  <p class="rc-lead">この内容で評価を送信しますか？</p>

  <article class="rc-card">
    <span class="rc-label">トレーナー</span>
    <p class="rc-name">{{ trainer_name }}</p>
  </article>

  <article class="rc-card">
    <span class="rc-label">評価</span>
    <p class="rc-rating" aria-label="5点中{{ rating }}点">
      <span class="rc-stars" aria-hidden="true">
        {% for i in range(1, 6) %}<span class="{{ 'on' if rating and i <= rating|int else 'off' }}">★</span>{% endfor %}
      </span>
      <span class="rc-num">{{ rating }}<small> / 5</small></span>
    </p>
  </article>

  <article class="rc-card">
    <h2 class="rc-title">評価コメント</h2>
    <p class="rc-comment">{{ comment }}</p>
  </article>

  <div class="rc-actions">
    <a class="rc-btn" href="{{ url_for('request_review_done', request_id=request_id) }}">送信する</a>
    <a class="rc-back" href="{{ url_for('request_review', request_id=request_id) }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      戻る
    </a>
  </div>
</section>
{% endblock %}
