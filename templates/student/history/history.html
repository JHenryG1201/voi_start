{% extends "base.html" %}
{% load static %}

{% block title %}依頼・予約履歴{% endblock %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/history.css' %}">
{% endblock %}

{% block content %}
<section class="hs">
  <h1>依頼・予約履歴</h1>
  <p class="hs-lead">確認したい履歴を選択してください。</p>

  <ul class="hs-list">
    <li>
      {% comment %} <a class="hs-row" href="{{ url_for('request_history') }}"> {% endcomment %}
      <a class="hs-row" href="">
        <span class="hs-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></span>
        <span class="hs-text"><span class="hs-title">依頼履歴</span><span class="hs-desc">フィードバックの依頼を確認する</span></span>
        <svg class="hs-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </li>
    <li>
      <a class="hs-row" href="{% url 'reservation_history' %}">
        <span class="hs-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
        <span class="hs-text"><span class="hs-title">予約履歴</span><span class="hs-desc">レッスンの予約を確認する</span></span>
        <svg class="hs-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </li>
  </ul>

  <a class="hs-back" href="{% url 'student_home' %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    ホームに戻る
  </a>
</section>
{% endblock %}
