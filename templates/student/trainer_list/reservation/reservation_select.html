{% extends "base.html" %}

{% block title %}レッスン予約{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/reservation_select.css') }}">
{% endblock %}

{% block content %}
<section class="rs">
  <h1>レッスン予約</h1>

  <div class="rs-summary">
    <div class="rs-trainer">
      <span class="rs-label">トレーナー</span>
      <span class="rs-name">{{ trainer_name }}</span>
    </div>
    <div class="rs-price">
      <span class="rs-label">レッスン料金</span>
      <span class="rs-price-value">{{ "{:,}".format(lesson_price) }}<small>円</small></span>
    </div>
  </div>

  <form class="rs-form" action="{{ url_for('reservation_payment', trainer_id=trainer_id) }}" method="get">

    <div class="rs-card">
      <h2 class="rs-legend">予約日時を選択してください</h2>

      <div class="rs-field">
        <label class="rs-field-label" for="reservation_date">予約日</label>
        <select class="rs-input" id="reservation_date" name="reservation_date">
          <option value="2026-10-20">2026年10月20日</option>
          <option value="2026-10-21">2026年10月21日</option>
          <option value="2026-10-22">2026年10月22日</option>
        </select>
      </div>

      <div class="rs-field">
        <label class="rs-field-label" for="reservation_time">予約時間</label>
        <select class="rs-input" id="reservation_time" name="reservation_time">
          <option value="10:00">10:00～11:00</option>
          <option value="14:00">14:00～15:00</option>
          <option value="16:00">16:00～17:00</option>
        </select>
      </div>
    </div>

    <fieldset class="rs-card">
      <legend class="rs-legend">受講形式</legend>

      <label class="rs-choice">
        <input type="radio" name="lesson_type" value="online" checked>
        <span class="rs-box">オンライン</span>
      </label>
      <label class="rs-choice">
        <input type="radio" name="lesson_type" value="offline">
        <span class="rs-box">対面</span>
      </label>
    </fieldset>

    <button type="submit" class="rs-submit">次へ</button>
  </form>

  <a class="rs-back" href="{{ url_for('trainer_detail', trainer_id=trainer_id) }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    トレーナープロフィールに戻る
  </a>
</section>
{% endblock %}
