{% extends "base.html" %}

{% block title %}依頼完了{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/feedback_done.css') }}">
{% endblock %}

{% block content %}
<section class="fdn">
  <div class="fdn-visual" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  </div>

  <h1>フィードバック依頼完了</h1>
  <p class="fdn-lead">
    フィードバック依頼を受け付けました。<br>
    トレーナーからのフィードバックをお待ちください。
  </p>

  <p class="fdn-price">
    <span class="fdn-price-label">依頼料金</span>
    <span class="fdn-price-value">1,000<small>円</small></span>
  </p>

  <div class="fdn-links">
    <a class="fdn-btn" href="{{ url_for('home_student') }}">
      ホームに戻る
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <a class="fdn-sub" href="{{ url_for('trainer_detail', trainer_id=trainer_id) }}">トレーナープロフィールに戻る</a>
  </div>
</section>
{% endblock %}
