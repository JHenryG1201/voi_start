{% extends "base.html" %}

{% block title %}フィードバック依頼{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/feedback_upload.css') }}">
{% endblock %}

{% block content %}
<section class="fu">
  <h1 class="fu-page">フィードバック依頼</h1>

  <div class="fu-hero">
    <span class="fu-badge">トレーナー</span>
    <p class="fu-hero-name">{{ trainer_name }}</p>
    <p class="fu-hero-price">ワンコーラス：<strong>1,000円</strong></p>
  </div>

  <form class="fu-form" action="{{ url_for('feedback_payment', trainer_id=trainer_id) }}" method="get">

    <div class="fu-panel">
      <h2 class="fu-title">音声ファイルのアップロード</h2>
      <label class="fu-label-b" for="audio_file">音声ファイル</label>
      <input class="fu-file-input" type="file" id="audio_file" name="audio_file" accept=".mp3,.mp4">
      <p class="fu-note">アップロードできるファイル形式：mp3・mp4</p>
    </div>

    <div class="fu-actions">
      <a class="fu-cancel" href="{{ url_for('trainer_detail', trainer_id=trainer_id) }}">戻る</a>
      <button type="submit" class="fu-submit">次へ</button>
    </div>
  </form>
</section>
{% endblock %}
