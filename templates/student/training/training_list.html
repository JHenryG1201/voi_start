{% extends "base.html" %}
{% load static %}

{% block title %}トレーニング{% endblock %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/recommended_training.css' %}">
{% endblock %}

{% block content %}
<section class="tr">
  <h1>AIおすすめトレーニング</h1>
  <p class="tr-lead">あなたにおすすめのトレーニング</p>

  <ul class="tr-list">
    {% for training in trainings  %}
      <li>
        <a class="tr-card" href="{% url 'training_detail' training.id %}">
          <span class="tr-num">1</span>
          <span class="tr-text">
            <span class="tr-title">{{ training.title }}</span>
            <span class="tr-desc">{{ training.purpose }}</span>
          </span>
          <svg class="tr-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </li>
    {% endfor %}
  </ul>

  <a class="tr-back" href="{% url 'student_home' %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    生徒ホームに戻る
  </a>
</section>
{% endblock %}
