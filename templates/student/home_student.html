{% extends "base.html" %}
{% load static %}

{% block title %}生徒ホーム{% endblock %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/home_student.css' %}">
{% endblock %}

{% block content %}
    <section>
      <h2 class="label">誰でも使える</h2>
      <div class="heroes">
        <a class="hero" href="/ai_analysis">
          <span class="text"><span class="title">AI分析</span><span class="desc">声をAIが診断します</span></span>
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3l2-6 4 12 3-9 2 3h4"/></svg></span>
        </a>
        <a class="hero alt" href="/training">
          <span class="text"><span class="title">トレーニング</span><span class="desc">毎日の発声練習</span></span>
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
        </a>
      </div>
    </section>

    <section class="member">
      <h2 class="label">月額会員限定 <span class="badge">会員</span></h2>
      <div class="panel">
        <div class="tiles">
          <a class="tile" href="/trainer">
            <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="会員限定"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
            トレーナー
          </a>
          <a class="tile" href="/feedback">
            <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="会員限定"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></span>
            フィードバック
          </a>
          <a class="tile" href="/lesson">
            <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="会員限定"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
            レッスン
          </a>
        </div>
      </div>
    </section>
{% endblock %}
