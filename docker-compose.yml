x-django-common: &django-common
  build: .
  env_file:
    - .env
  environment:
    TZ: Asia/Tokyo
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - media_data:/app/media        # must match MEDIA_ROOT in settings.py
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
    searxng:
      condition: service_started

services:
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SUBDOMAINS=${DUCKDNS_SUBDOMAINS}
      - TOKEN=${DUCKDNS_TOKEN}
      - UPDATE_IP=${DUCKDNS_UPDATE_IP:-}
    volumes:
      - ./duckdns/config:/config # Optional for persistence
    restart: unless-stopped
  web:
    <<: *django-common
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: unless-stopped
  
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  
  worker:
    <<: *django-common
    command: celery -A voi_start worker --loglevel=info --concurrency=2
    restart: unless-stopped
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    expose:
      - "8080"
    

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_development_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_development_data:
  postgres_production_data:
  media_data: