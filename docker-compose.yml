services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DEBUG=True
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: voi-start-database
      POSTGRES_USER: henry
      POSTGRES_PASSWORD: kaungsithu
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U henry"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
